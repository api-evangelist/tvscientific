- status: 403
  detail: Authentication credentials were not provided.
  body: '{"detail":"Authentication credentials were not provided."}'
  meaning: >-
    The request carried no credentials. Returned by every collection under /v1/ and /v2/
    except /v1/terms_and_conditions/, for GET, POST and OPTIONS alike.
  remediation: >-
    Authenticate. The credential type is not publicly documented and no WWW-Authenticate
    challenge is sent; obtain access through the tvScientific account team.
  observed_at: https://api.tvscientific.app/v1/campaigns/
  note: >-
    DRF returns 403 here rather than the semantically correct 401 for an unauthenticated
    request, because no authentication class advertises a challenge. Clients cannot
    distinguish "not authenticated" from "authenticated but forbidden" by status alone —
    only by the message string.
