format_note: >-
  Not RFC 9457. Errors are the Django REST Framework default envelope
  {"detail": "<message>"} served as application/json. There is no `type` URI, no `title`,
  no `status` member in the body, no `instance`, and no stable machine-readable error code —
  an agent can only match on the human-readable English string, which is a fragile contract.
