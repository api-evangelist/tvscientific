aid: tvscientific
name: Tvscientific
description: >-
  tvScientific is a connected-TV (CTV) advertising platform for performance
  marketers, pairing premium streaming-TV inventory with AI-powered bidding and
  optimization and outcome-based measurement so brands can run television
  campaigns against measurable goals like sales, app installs, and site traffic.
  It positions itself on "premium inventory, AI-powered optimization, and radical
  transparency," and offers a self-serve buying platform plus an academy and
  reporting resources for advertisers and agencies. Originally surfaced as a
  portfolio company of Norwest Venture Partners, its own web properties now brand
  it "tvScientific by Pinterest." No public developer/API surface, OpenAPI, or
  documentation portal was found during enrichment; the company publishes a
  trust center, blog, and legal pages.
