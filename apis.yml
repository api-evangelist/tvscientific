aid: tvscientific
name: Tvscientific
description: >-
  tvScientific is a connected-TV (CTV) advertising platform for performance marketers,
  pairing premium streaming-TV inventory with AI-powered bidding and optimization and
  outcome-based measurement so brands can run television campaigns against measurable goals
  like sales, app installs, and site traffic. It positions itself on "premium inventory,
  AI-powered optimization, and radical transparency," and offers a self-serve buying platform
  plus an academy and reporting resources for advertisers and agencies. Originally surfaced as
  a portfolio company of Norwest Venture Partners, it now brands itself "tvScientific by
  Pinterest" after Pinterest completed its acquisition of the company in February 2026.
  tvScientific runs a real Campaign Management REST API at api.tvscientific.app — named as a
  component on its own status page — whose v1 and v2 version roots publicly enumerate 50
  resource collections covering campaigns, line items, creatives, audiences, targeting, bid
  strategies, billing and accounts. It publishes no developer program around it: no portal,
  no API reference, no OpenAPI or GraphQL contract, no SDK, no CLI, and no MCP or agent
  surface. Every collection but one is credentialed, both documentation hosts sit behind a
  customer login, and the machine-readable operational signal is limited to an Atlassian
  Statuspage API and a first-party Google Tag Manager measurement pixel.
