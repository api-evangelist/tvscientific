apis:
- name: tvScientific Campaign Management API
  description: >-
    The REST API behind the tvScientific Campaign Management UI, named by tvScientific's own
    status page as the "Campaign Management API" component running at api.tvscientific.app.
    Two major versions serve concurrently. The v1 root advertises 35 collections spanning
    advertisers, organizations, tenants, users, campaigns, creatives, creative and static
    display line items, audiences, bid strategies, billing accounts, payment profiles,
    contracts and assets; the v2 root advertises 15 narrower campaign-buying collections
    including campaigns, lineitems, creatives, targeting keys, targeting reach, simplified
    bid strategies, bidder config and a quickstart surface. Both version roots and one
    collection (terms_and_conditions) are readable anonymously; every other collection
    returns HTTP 403. tvScientific publishes no OpenAPI, no API reference and no SDK for it,
    so the artifacts in this repo are probed rather than harvested.
  humanURL: https://status.tvscientific.com/
  baseURL: https://api.tvscientific.app/v1/
