- id: rfc9116
  name: security.txt
  conforms: false
  evidence: >-
    No first-party security.txt on any tvScientific host. status.tvscientific.com serves one,
    but its Canonical, Contact and Policy fields are all atlassian.com — it is the Statuspage
    vendor's document, not tvScientific's.
- id: rfc8594
  name: Sunset / Deprecation headers
  conforms: false
  evidence: No Sunset or Deprecation header on either version root; no deprecation policy published.
- id: pagination
  conforms: true
  evidence: >-
    Consistent page envelope {count, next, previous, results} with `page` and `page_size`
    query parameters, observed at https://api.tvscientific.app/v1/terms_and_conditions/
    (HTTP 200). Django REST Framework PageNumberPagination.
- id: idempotency
  conforms: false
  evidence: No Idempotency-Key header advertised or documented; no idempotent-retry semantics published.
- id: hateoas
  conforms: true
  evidence: >-
    The API is hyperlink-driven: version roots return a link index of every collection, and
    records carry absolute self `url` fields with relationships expressed as absolute
    resource URLs (DRF HyperlinkedModelSerializer). Observed at /v1/, /v2/ and
    /v1/terms_and_conditions/.
- id: content-negotiation
  conforms: true
  evidence: >-
    Accept-driven with an explicit ?format= override; renders application/json and text/html,
    parses application/json, application/x-www-form-urlencoded and multipart/form-data. Read
    from the DRF OPTIONS metadata document.
- id: http-options-introspection
  conforms: true
  evidence: >-
    OPTIONS returns a machine-readable field-level metadata document (name, description,
    renders, parses, actions.POST field types/required/read_only/max_length). Confirmed 200
    on /v1/terms_and_conditions/; 403 on every other collection.
