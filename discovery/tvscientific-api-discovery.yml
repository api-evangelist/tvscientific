source: >-
  Live unauthenticated HTTP probes of https://api.tvscientific.app/ on 2026-08-12,
  reached from the tvScientific status page component "Campaign Management API"
  (description "api.tvscientific.app") at https://status.tvscientific.com/api/v2/summary.json
title: tvScientific Campaign Management API — discovery record
summary: >-
  tvScientific publishes no developer portal, no OpenAPI/Swagger document, no GraphQL
  endpoint, no MCP server and no A2A agent card. It DOES run a live, publicly reachable
  REST API at https://api.tvscientific.app whose version root indexes (/v1/ and /v2/)
  are served anonymously and enumerate every resource collection. Every collection but
  one requires authentication. This file records exactly what the anonymous probe saw,
  verbatim; nothing here is inferred beyond the HTTP responses cited.

ownership:
  verdict: confirmed
  why: >-
    The host is named by tvScientific's own status page (status.tvscientific.com, page id
    4s33x5yk9wlx, page.name "tvScientific") as the component "Campaign Management API",
    description "api.tvscientific.app". Independently, the one publicly readable collection
    (/v1/terms_and_conditions/) returns records whose `text` field links to
    https://www.tvscientific.com/platform-master-agreement-demand/ — tvScientific's own
    Platform Master Agreement. Both signals point at tvScientific, not a sibling brand.
  evidence:
    - url: https://status.tvscientific.com/api/v2/summary.json
      status: 200
      detail: 'component "Campaign Management API" description "api.tvscientific.app"'
    - url: https://api.tvscientific.app/v1/terms_and_conditions/
      status: 200
      detail: 'record 1 text -> https://www.tvscientific.com/platform-master-agreement-demand/'

