public_collections:
  - path: /v1/terms_and_conditions/
    status: 200
    note: >-
      The only collection readable without credentials. Returns the DRF page envelope
      {count,next,previous,results} with 2 hyperlinked records. OPTIONS on this path also
      returns 200 with the full DRF metadata document (field names, types, required flags,
      max_length) — saved verbatim to discovery/tvscientific-options-terms-and-conditions.json.
      Every other collection returns 403 to both GET and OPTIONS.

gated:
  posture: authenticated
  status: 403
  body: '{"detail":"Authentication credentials were not provided."}'
  note: >-
    Django REST Framework returns 403 (not 401) and sends no WWW-Authenticate challenge, so
    the credential type cannot be determined anonymously. No token, login, OAuth or OIDC
    endpoint answered: /o/token/, /o/authorize/, /token/, /api-token-auth/, /v1/auth/,
    /v1/login/, /.well-known/oauth-authorization-server and /.well-known/openid-configuration
    all returned 404 on api.tvscientific.app.

no_contract_published: true
no_contract_note: >-
  A live API is NOT a published contract. tvScientific ships no OpenAPI, no GraphQL SDL, no
  AsyncAPI, no MCP manifest, no agent card, no llms.txt, no /.well-known/ documents and no
  public developer portal or API reference. Both documentation hosts are credentialed:
  help.tvscientific.com 301s to an Atlassian Service Desk login and support.tvscientific.com
  redirects into a Salesforce Community SAML flow. This record is the machine-readable
  substitute API Evangelist could build from the public surface — it is NOT a specification
  and must never be treated as one, and no OpenAPI has been synthesised from it.
